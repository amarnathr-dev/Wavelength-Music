services:
  - type: web
    name: wavelength
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: WAVELENGTH_COUNTRY
        value: IN
